<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C272B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5S EMEMSA">
<title>5S EMEMSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  --bg:#E9ECEC;--panel:#FFFFFF;--ink:#1C272B;--muted:#5B676B;--line:#D2D8D9;
  --cara-clara:#C3C5C8;--cara-media:#808285;--cara-oscura:#1C272B;--amarillo:#F2C500;--verde:#2E7D5B;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--panel:#1C2427;--ink:#E8ECEC;--muted:#9AA7AB;--line:#2F3B40;--cara-clara:#5B6266;--cara-media:#3B4246;--cara-oscura:#0B0F10;--verde:#5BB38A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121819;--panel:#1C2427;--ink:#E8ECEC;--muted:#9AA7AB;--line:#2F3B40;--cara-clara:#5B6266;--cara-media:#3B4246;--cara-oscura:#0B0F10;--verde:#5BB38A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}

/* cabecera */
.cab{background:#fff;border-bottom:1px solid #D2D8D9}
.cab-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cab img{height:46px;width:auto;display:block}
.tema{display:flex;gap:2px;background:#EEF1F0;border:1px solid #D2D8D9;border-radius:999px;padding:3px}
.tema button{border:0;background:none;color:#5B676B;font:600 .9rem "Barlow",sans-serif;padding:5px 12px;border-radius:999px;cursor:pointer}
.tema button[aria-pressed="true"]{background:#1C272B;color:#fff}
.cinta{height:8px;background:repeating-linear-gradient(-45deg,var(--amarillo) 0 14px,#1C272B 14px 28px)}

main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:36px 20px 40px}
.intro{max-width:620px}
.migas{display:flex;align-items:center;gap:8px;min-height:36px;margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.migas button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px 5px 10px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.migas button:hover{border-color:var(--ink)}
h1{font:700 clamp(2.4rem,6vw,3.6rem)/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em;margin:0}
.lead{font-size:1.12rem;color:var(--muted);margin:12px 0 0;max-width:56ch}

/* opciones */
.opciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}
@media (max-width:700px){.opciones{grid-template-columns:1fr}}
.op{position:relative;display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center;text-align:left;width:100%;
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 64px 22px 18px;cursor:pointer;text-decoration:none;
  transition:border-color .15s,transform .15s}
.op:hover{border-color:var(--ink);transform:translateY(-2px)}
.op:active{transform:none}
.op h2{font:700 1.75rem/1.05 "Barlow Condensed",sans-serif;margin:0;overflow-wrap:break-word;hyphens:auto}
.op .quien{display:block;font-weight:600;color:var(--muted);margin:6px 0 0}
.op p{margin:8px 0 0;color:var(--muted);font-size:.98rem}
.op .ir{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:background .15s}
.op:hover .ir{background:var(--amarillo)}
.op:hover .ir path{stroke:#1C272B}
.op svg.cubo{width:116px;height:116px;display:block}
.cubo .hex{transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform-origin:50px 52px}
.op:hover .cubo .hex{transform:scale(1.07) rotate(-6deg)}
.op .candado{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.88rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--ink)}

/* pasos (secuencia real del proceso) */
.flujo{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.flujo h3{font:700 1.25rem "Barlow Condensed",sans-serif;margin:0 0 12px}
.flujo ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:p}
@media (max-width:700px){.flujo ol{grid-template-columns:1fr}}
.flujo li{counter-increment:p;display:grid;grid-template-columns:36px 1fr;gap:10px;color:var(--muted);font-size:.95rem}
.flujo li::before{content:counter(p);width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 1.1rem "Barlow Condensed",sans-serif}
.flujo b{color:var(--ink);font-weight:600}

/* transición entre pantallas */
.vista{animation:entra .45s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:520px){.op{grid-template-columns:72px minmax(0,1fr);gap:14px;padding:18px 52px 18px 14px}.op svg.cubo{width:72px;height:72px}.op h2{font-size:1.45rem}.op .ir{top:14px;right:12px}}
/* héroe: el cubo del logo se arma una sola vez al entrar */
.cabeza{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.heroe{width:190px;height:190px}
.heroe .c1,.heroe .c2,.heroe .c3,.heroe .h5{animation:arma .7s cubic-bezier(.2,.9,.25,1.15) both}
.heroe .c1{--d:translate(0,-26px);animation-delay:.05s}.heroe .c2{--d:translate(-24px,14px);animation-delay:.15s}.heroe .c3{--d:translate(24px,14px);animation-delay:.25s}
.heroe .h5{--d:scale(.4);transform-origin:50px 52px;animation-delay:.45s}
@keyframes arma{from{opacity:0;transform:var(--d)}to{opacity:1;transform:none}}
@media (max-width:700px){.heroe{width:96px;height:96px}}
@media (prefers-reduced-motion:reduce){.heroe *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.vista{animation:none}.op,.cubo .hex,.op .ir{transition:none}.op:hover{transform:none}}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer div{max-width:1040px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{font-weight:600}
</style>
</head>
<body>
<header class="cab">
  <div class="cab-in">
    <img src="logo.png" alt="EMEMSA" width="154" height="46">
    <div class="tema" role="group" aria-label="Apariencia" id="tema">
      <button type="button" data-t="light" aria-pressed="false">Claro</button>
      <button type="button" data-t="dark" aria-pressed="false">Oscuro</button>
    </div>
  </div>
  <div class="cinta" aria-hidden="true"></div>
</header>
<main id="main" aria-live="polite"></main>
<footer><div><span>Programa 5S de EMEMSA</span><span>¿Dudas o sugerencias? Escríbenos a <a href="mailto:auxiliar5s@ememsa.pe">auxiliar5s@ememsa.pe</a></span></div></footer>

<script>
/* ícono: el cubo del logo con un pictograma en el hexágono */
var PICT={
  equipo:'<path d="M41 47h18M41 53h18M41 59h11" stroke="#1C272B" stroke-width="3.2" stroke-linecap="round"/><rect x="36" y="39" width="28" height="28" rx="3" fill="none" stroke="#1C272B" stroke-width="3.2"/><path d="M45 39v-3h10v3" fill="none" stroke="#1C272B" stroke-width="3.2" stroke-linejoin="round"/>',
  coord:'<path d="M38 64V55M46 64V48M54 64V52M62 64V42" stroke="#1C272B" stroke-width="4.2" stroke-linecap="round"/>',
  auditor:'<circle cx="47" cy="49" r="9" fill="none" stroke="#1C272B" stroke-width="3.6"/><path d="M54 56l8 8" stroke="#1C272B" stroke-width="4.2" stroke-linecap="round"/>',
  facilitador:'<path d="M38 53l7 7 15-15" fill="none" stroke="#1C272B" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>',
  excel:'<rect x="37" y="40" width="26" height="25" rx="3" fill="none" stroke="#1C272B" stroke-width="3.2"/><path d="M37 49h26M37 57h26M46 40v25" stroke="#1C272B" stroke-width="2.6"/>'
};
function cubo(p){return '<svg class="cubo" viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="M50 6 92 29 50 52 8 29Z" fill="var(--cara-clara)"/>'+
  '<path d="M8 29 50 52v44L8 73Z" fill="var(--cara-oscura)"/>'+
  '<path d="M92 29 50 52v44l42-23Z" fill="var(--cara-media)"/>'+
  '<g class="hex"><path d="M50 27 71 39.5v25L50 77 29 64.5v-25Z" fill="var(--amarillo)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>'+PICT[p]+'</g></svg>'}
var HEROE='<svg class="heroe" viewBox="0 0 100 100" aria-hidden="true">'+
  '<path class="c1" d="M50 6 92 29 50 52 8 29Z" fill="var(--cara-clara)"/>'+
  '<path class="c2" d="M8 29 50 52v44L8 73Z" fill="var(--cara-oscura)"/>'+
  '<path class="c3" d="M92 29 50 52v44l42-23Z" fill="var(--cara-media)"/>'+
  '<g class="h5"><path d="M50 27 71 39.5v25L50 77 29 64.5v-25Z" fill="var(--amarillo)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>'+
  '<text x="50" y="60" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="22" fill="#1C272B">5S</text></g></svg>';
var FLECHA='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ATRAS='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var VISTAS={
  inicio:{titulo:"Programa 5S",lead:"Elige cómo vas a participar hoy.",opciones:[
    {ir:"#equipo",icono:"equipo",titulo:"Inspección y subsanación",quien:"Auditores y facilitadores de área",texto:"Registra los hallazgos del ANTES o sube las mejoras del DESPUÉS."},
    {ir:"#coordinacion",icono:"coord",titulo:"Coordinación 5S",quien:"Coordinadora del programa",texto:"Pasa los checklists al Excel de diagnóstico.",candado:true}]},
  equipo:{titulo:"Inspección y subsanación",lead:"¿Qué te toca hacer?",atras:true,opciones:[
    {ir:"inspeccion.html",icono:"auditor",titulo:"Reporte de inspección",quien:"Soy auditor",texto:"Toma las fotos del ANTES, registra los hallazgos por sub-área y genera el Word con el ZIP de fotos."},
    {ir:"levantamiento.html",icono:"facilitador",titulo:"Subsanación de observaciones",quien:"Soy facilitador del área",texto:"Carga el Word que te enviaron, toma las fotos del DESPUÉS y genera el Word subsanado."}],
    flujo:["<b>El auditor</b> inspecciona y envía el Word con el ZIP de fotos.","<b>La coordinadora</b> envía el informe a cada área.","<b>El facilitador</b> subsana y envía el Word a auxiliar5s@ememsa.pe."]},
  coordinacion:{titulo:"Coordinación 5S",lead:"Herramientas de la coordinadora. Se abren con contraseña.",atras:true,opciones:[
    {ir:"coordinadora.html",icono:"excel",titulo:"Checklists al Excel",quien:"Diagnóstico mensual",texto:"Sube las fotos de los checklists llenados a mano, revisa lo leído y actualiza el Excel de diagnóstico.",candado:true}]}
};
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}
function pintar(){
  var clave=(location.hash||"").slice(1);if(!VISTAS[clave])clave="inicio";var v=VISTAS[clave];
  var m=document.getElementById("main");m.textContent="";
  var cont=el('<section class="vista"></section>');
  var intro=el('<div class="intro"></div>');
  var migas=el('<div class="migas"></div>');
  if(v.atras){var b=el('<button type="button">'+ATRAS+'Volver</button>');b.addEventListener("click",function(){if(history.length>1&&document.referrer.indexOf(location.host)>=0)history.back();else location.hash=""});migas.appendChild(b)}
  intro.appendChild(migas);
  var h=document.createElement("h1");h.textContent=v.titulo;h.tabIndex=-1;intro.appendChild(h);
  var p=document.createElement("p");p.className="lead";p.textContent=v.lead;intro.appendChild(p);
  if(clave==="inicio"){var cab=el('<div class="cabeza"></div>');cab.appendChild(intro);cab.appendChild(el(HEROE));cont.appendChild(cab)}else cont.appendChild(intro);
  var ops=el('<div class="opciones"></div>');
  v.opciones.forEach(function(o){
    var a=el('<a class="op" href="'+o.ir+'">'+cubo(o.icono)+'<div><h2></h2><span class="quien"></span><p></p>'+(o.candado?'<span class="candado"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="2" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Requiere contraseña</span>':'')+'</div><span class="ir">'+FLECHA+'</span></a>');
    a.querySelector("h2").textContent=o.titulo;a.querySelector(".quien").textContent=o.quien;a.querySelector("p").textContent=o.texto;
    ops.appendChild(a)});
  cont.appendChild(ops);
  if(v.flujo){var f=el('<div class="flujo"><h3>Cómo fluye el reporte</h3><ol></ol></div>');v.flujo.forEach(function(t){var li=document.createElement("li");li.innerHTML="<span>"+t+"</span>";f.querySelector("ol").appendChild(li)});cont.appendChild(f)}
  m.appendChild(cont);
  if(clave!=="inicio")h.focus({preventScroll:true});
  document.title=(clave==="inicio"?"":v.titulo+" · ")+"5S EMEMSA";
}
addEventListener("hashchange",function(){pintar();scrollTo(0,0)});
pintar();

function temaActual(){var t=document.documentElement.getAttribute("data-theme");if(t)return t;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function pintarTema(){var t=temaActual();document.querySelectorAll("#tema button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===t?"true":"false")})}
document.querySelectorAll("#tema button").forEach(function(b){b.addEventListener("click",function(){document.documentElement.setAttribute("data-theme",b.dataset.t);try{localStorage.setItem("tema",b.dataset.t)}catch(e){}pintarTema()})});
pintarTema();
</script>
<script>if("serviceWorker" in navigator&&location.protocol!=="file:"){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
