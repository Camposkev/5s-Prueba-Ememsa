<head>

<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#EEF1F0;--panel:#FFFFFF;--ink:#1C272B;--muted:#5D6B70;--line:#D3DADB;--field:#F7F9F9;--tape:#F2B705;--red:#D7263D;--ok:#2E7D5B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B1E;--panel:#1D262A;--ink:#E7ECEC;--muted:#9AA8AC;--line:#33424A;--field:#172024;--red:#FF5C6F;--ok:#5BB38A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141B1E;--panel:#1D262A;--ink:#E7ECEC;--muted:#9AA8AC;--line:#33424A;--field:#172024;--red:#FF5C6F;--ok:#5BB38A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.caja{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.cinta{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 12px,#1C272B 12px 24px)}
.dentro{padding:26px 24px 22px}
.cand{width:64px;height:64px;border-radius:16px;background:var(--ink);display:grid;place-items:center;margin-bottom:14px;transition:transform .4s}
.cand svg{width:34px;height:34px}
.cand.abierto{background:var(--ok);transform:scale(1.06)}
.cand .arco{transition:transform .35s;transform-origin:22px 14px}
.cand.abierto .arco{transform:translateY(-4px) rotate(-28deg)}
h1{font:700 1.9rem/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
.sub{color:var(--muted);margin:6px 0 18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);font-weight:500}
.campo{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden}
.campo:focus-within{outline:2px solid var(--tape);outline-offset:1px}
.campo input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.05rem;padding:11px 12px;outline:none}
.ver{border:0;background:none;color:var(--muted);font:600 .9rem "Barlow",sans-serif;padding:0 12px;cursor:pointer}
.recordar{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.92rem;color:var(--muted)}
.btn{width:100%;margin-top:16px;border:0;border-radius:10px;padding:12px;background:var(--ink);color:var(--bg);font:700 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.02em;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.ver:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.92rem;font-weight:600;color:var(--red)}
.msg.ok{color:var(--ok)}
.agitar{animation:agitar .35s}
@keyframes agitar{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pie{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pie a{color:inherit}
@media (prefers-reduced-motion:reduce){.agitar{animation:none}.cand,.cand .arco{transition:none}}
</style>
</head>
<body>
<main class="caja" id="caja">
  <div class="cinta" aria-hidden="true"></div>
  <div class="dentro">
    <div class="cand" id="cand" aria-hidden="true">
      <svg viewBox="0 0 44 44" fill="none"><path class="arco" d="M14 20v-6a8 8 0 0 1 16 0v6" stroke="#F2B705" stroke-width="4" stroke-linecap="round"/><rect x="9" y="20" width="26" height="19" rx="4" fill="#F2B705"/><circle cx="22" cy="29" r="3" fill="#1C272B"/></svg>
    </div>
    <h1>Checklists al Excel</h1>
    <p class="sub">Acceso solo para la coordinadora de 5S.</p>
    <form id="form" autocomplete="on">
      <input type="text" name="username" value="coordinadora-5s" autocomplete="username" hidden>
      <label class="f" for="clave">Contraseña</label>
      <div class="campo"><input id="clave" type="password" autocomplete="current-password" required autofocus><button type="button" class="ver" id="ver" aria-pressed="false">Mostrar</button></div>
      <label class="recordar"><input type="checkbox" id="rec"> Recordar en este equipo</label>
      <button class="btn" id="ent" type="submit">Ingresar</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="pie"><a href="index.html">← Volver al inicio</a><span>¿Olvidaste la contraseña? <a href="mailto:auxiliar5s@ememsa.pe">auxiliar5s@ememsa.pe</a></span></div>
  </div>
</main>

<script>
(function(){
var CK=JSON.parse(document.getElementById("ckdata").textContent),SELF="<!doctype html>\n"+document.documentElement.outerHTML,KEY="ck5s";
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(u){var s="";u=new Uint8Array(u);for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function derivar(pass,salt,it){var base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])}
async function abrirCon(key){var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(CK.iv)},key,ub(CK.c));return dec.decode(plain)}
window.__ck={
  salir:function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
  recifrar:async function(pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=CK.it;
    var key=await derivar(pass,salt,it),c=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(window.__ckPlain));
    var data=JSON.stringify({v:1,it:it,s:b64(salt),iv:b64(iv),c:b64(c)});
    return SELF.replace(/(<script id="ckdata" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+data+b})}};
function mostrar(html,key,recordar){window.__ckPlain=html;
  if(recordar)crypto.subtle.exportKey("raw",key).then(function(r){try{localStorage.setItem(KEY,JSON.stringify({s:CK.s,k:b64(r)}))}catch(e){}});
  document.open();document.write(html);document.close()}
var cand=document.getElementById("cand"),msg=document.getElementById("msg"),ent=document.getElementById("ent"),clave=document.getElementById("clave"),caja=document.getElementById("caja"),fallos=0,espera=0;
document.getElementById("ver").addEventListener("click",function(){var v=clave.type==="password";clave.type=v?"text":"password";this.textContent=v?"Ocultar":"Mostrar";this.setAttribute("aria-pressed",v);clave.focus()});
document.getElementById("form").addEventListener("submit",async function(e){e.preventDefault();
  if(!window.crypto||!crypto.subtle){msg.textContent="Este navegador no permite abrir la herramienta. Usa Chrome o Edge actualizados.";return}
  var ahora=Date.now();if(ahora<espera){msg.textContent="Espera "+Math.ceil((espera-ahora)/1000)+" s antes de intentar de nuevo.";return}
  if(!clave.value){msg.textContent="Escribe la contraseña.";return}
  ent.disabled=true;ent.textContent="Verificando…";msg.textContent="";msg.className="msg";
  try{var key=await derivar(clave.value,ub(CK.s),CK.it),html=await abrirCon(key);
    cand.classList.add("abierto");msg.className="msg ok";msg.textContent="Acceso concedido.";
    var rec=document.getElementById("rec").checked;setTimeout(function(){mostrar(html,key,rec)},450)}
  catch(err){fallos++;ent.disabled=false;ent.textContent="Ingresar";
    msg.textContent=fallos>=3?"Contraseña incorrecta ("+fallos+" intentos).":"Contraseña incorrecta.";
    if(fallos>=5)espera=Date.now()+Math.min(60,5*(fallos-4))*1000;
    caja.classList.remove("agitar");void caja.offsetWidth;caja.classList.add("agitar");clave.select()}});
// sesión recordada
(async function(){try{var g=JSON.parse(localStorage.getItem(KEY)||"null");if(!g||g.s!==CK.s){if(g)localStorage.removeItem(KEY);return}
  var key=await crypto.subtle.importKey("raw",ub(g.k),{name:"AES-GCM"},true,["encrypt","decrypt"]),html=await abrirCon(key);mostrar(html,key,false)}
  catch(e){try{localStorage.removeItem(KEY)}catch(x){}}})();
})();
